server.port=8080

# Same env variables as your old console project
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management?serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false

# React dev server (Vite) origin
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
